<style>
:root{--red:#d91f26;--ink:#0b0b0c;--ink-2:#151518;--paper:#f3f0ea;--grey:#8b8b8e;--line:rgba(255,255,255,.13);--font-d:'Bebas Neue','Noto Sans SC',sans-serif;--font-c:'Oswald','Noto Sans SC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--ink);color:#fff;font-family:var(--font-c);overflow-x:hidden;cursor:none}a{color:inherit;text-decoration:none}button{font:inherit;cursor:none;border:0}::selection{color:#fff;background:var(--red)}
.cursor-dot,.cursor-ring{position:fixed;z-index:9999;top:0;left:0;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}.cursor-dot{width:8px;height:8px;background:var(--red)}.cursor-ring{width:36px;height:36px;border:1.5px solid rgba(217,31,38,.68);transition:.25s}.cursor-ring.hovering{width:62px;height:62px;border-color:var(--red);background:rgba(217,31,38,.11)}

.page{max-width:1240px;margin:0 auto;padding:84px 4vw 130px}.sec-head{display:flex;gap:16px;align-items:baseline;margin-bottom:29px}.sec-no{color:var(--red);font-family:var(--font-d);font-size:19px;letter-spacing:2px}.sec-head h2{font-family:var(--font-d);font-size:clamp(34px,4.5vw,58px);letter-spacing:1px}.sec-head h2 em{color:var(--red);font-style:normal}.sec-line{height:1px;flex:1;background:rgba(255,255,255,.15)}
.intro{display:grid;grid-template-columns:1.25fr .75fr;gap:23px}.story-card{position:relative;min-height:350px;padding:38px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}.story-card:before{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,15,17,.96) 0%,rgba(15,15,17,.76) 54%,rgba(15,15,17,.24)),var(--portrait) 107% 50% / 420px auto no-repeat;content:"";filter:grayscale(.25)}.story-card>*{position:relative;z-index:1}.story-card .quote-mark{color:var(--red);font-family:Georgia,serif;font-size:74px;line-height:.45}.story-card p{max-width:520px;margin-top:21px;color:#dedad2;font-size:15px;line-height:2;letter-spacing:1px}.story-card b{color:#fff}.story-note{display:flex;gap:9px;align-items:center;margin-top:28px;color:#aaa59e;font-size:10px;letter-spacing:2px}.story-note i{width:7px;height:7px;border-radius:50%;background:var(--red)}

.skill{display:grid;grid-template-columns:.83fr 1.17fr;gap:23px;margin-top:78px}.skill-panel{position:relative;padding:32px;overflow:hidden;border:1px solid rgba(217,31,38,.55);border-radius:22px;background:linear-gradient(145deg,#341115,#121214)}.skill-panel:after{position:absolute;right:-86px;bottom:-98px;width:300px;height:300px;border:1px solid rgba(255,255,255,.19);border-radius:50%;content:""}.skill-code{position:relative;z-index:1;color:rgba(255,255,255,.72);font-size:10px;letter-spacing:3px}.skill-name{position:relative;z-index:1;margin-top:35px;font-family:var(--font-d);font-size:clamp(44px,5vw,67px);line-height:.83;letter-spacing:1px}.skill-name span{display:block;color:var(--red);font-size:.36em;letter-spacing:3px}.skill-panel p{position:relative;z-index:1;margin-top:22px;color:#d4d0c8;font-size:12px;line-height:1.9;letter-spacing:.7px}.skill-detail{padding:8px 4px}.skill-detail h3{font-family:var(--font-d);font-size:35px;letter-spacing:1px}.skill-detail>p{margin-top:12px;color:#bbb7b0;font-size:13px;line-height:2;letter-spacing:.7px}.cue-list{display:grid;gap:10px;margin-top:24px}.cue{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#141416}.cue b{display:grid;width:21px;height:21px;flex:0 0 21px;border-radius:50%;place-items:center;background:var(--red);font-family:var(--font-d);font-size:13px}.cue span{padding-top:2px;color:#e5e1da;font-size:12px;letter-spacing:.7px}.monitor{display:flex;gap:9px;align-items:center;margin-top:17px;padding:11px 13px;border-left:2px solid var(--red);background:rgba(217,31,38,.08);color:#d7d2ca;font-size:10px;letter-spacing:1px}.monitor strong{color:#fff}
.cta{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;padding:25px 27px;border:1px solid var(--line);border-radius:18px;background:#141416}.cta-copy small{color:#aaa59e;font-size:10px;letter-spacing:2px}.cta-copy h3{margin-top:6px;font-size:16px;letter-spacing:1px}.cta a{display:inline-flex;gap:11px;align-items:center;padding:13px 18px;border-radius:999px;background:var(--red);font-size:11px;letter-spacing:2px;transition:.3s}.cta a:hover{transform:translateY(-4px);box-shadow:0 15px 32px -12px var(--red)}.cta svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2}
.back{display:inline-flex;gap:11px;align-items:center;margin-top:72px;padding:13px 21px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(255,255,255,.04);font-size:11px;letter-spacing:2px;transition:.3s}.back:hover{border-color:var(--red);background:var(--red);transform:translateX(-4px)}.back svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}.reveal{opacity:0;transform:translateY(38px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:translateY(0)}
@media(max-width:1040px){.nav-links{display:none}.intro,.skill{grid-template-columns:1fr}.story-card{min-height:300px}.hero:before{background:linear-gradient(90deg,#0b0b0c 5%,rgba(11,11,12,.6)),var(--portrait) 100% 49% / 590px auto no-repeat}.file-card .rank{font-size:75px}}@media(max-width:620px){body{cursor:auto}.cursor-dot,.cursor-ring{display:none}.nav{top:10px;width:calc(100% - 24px);height:58px;padding:0 17px}.nav-logo{font-size:23px}.nav-logo small,.nav-icon{display:none}.nav-icons{gap:5px}.hero{min-height:650px;padding:120px 20px 56px}.hero:before{background:linear-gradient(180deg,rgba(11,11,12,.88),rgba(11,11,12,.95)),var(--portrait) 50% 16% / 430px auto no-repeat}.hero-title{font-size:66px}.hero-meta{margin-top:21px}.hero-lead{font-size:12px}.page{padding:62px 20px 85px}.story-card{min-height:360px;padding:28px 22px}.story-card:before{background:linear-gradient(180deg,rgba(15,15,17,.86),rgba(15,15,17,.94)),var(--portrait) 85% 12% / 300px auto no-repeat}.story-card p{font-size:13px}.file-card{padding:25px 21px}.skill{margin-top:55px}.skill-panel{padding:26px}.skill-name{font-size:52px}.cta{display:block}.cta a{margin-top:16px}.sec-head h2{font-size:40px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

<main class="page"><section class="reveal"><div class="sec-head"><span class="sec-no">01</span><h2>人物 <em>档案</em></h2><span class="sec-line"></span></div><div class="intro"><article class="story-card" id="storyCard"><div class="quote-mark">“</div><p id="story"></p><div class="story-note"><i></i>从传奇中抽取可练习的动作语言</div></article><aside class="file-card"><small>PLAYER PROFILE / 个人档案</small><h3 id="fileName"></h3><dl id="fileMeta"></dl><div class="rank" id="fileNo"></div></aside></div></section><section class="skill" id="motion"><article class="skill-panel reveal"><div class="skill-code">SIGNATURE MOVE / AI READY</div><div class="skill-name" id="skillName"></div><p id="skillText"></p></article><article class="skill-detail reveal"><div class="sec-head"><span class="sec-no">02</span><h2>动作 <em>拆解</em></h2><span class="sec-line"></span></div><h3 id="detailTitle"></h3><p>不是复制动作外形，而是把身体位置、重心变化与出手节奏练成自己的稳定能力。</p><div class="cue-list" id="cueList"></div><div class="monitor">AI 监测重点：<strong id="monitor"></strong></div></article></section><section class="cta reveal"><div class="cta-copy"><small>把动作带回训练场</small><h3 id="planTitle"></h3></div><a id="planLink" href="#">进入训练模块 <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a></section><a class="back" href="coaches.html"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>返回球星殿堂</a></main>
<script src="assets/coach-data.js"></script>
<script>
(function(){
  var id = new URLSearchParams(location.search).get('player');
  var player = window.COACH_BY_ID[id] || window.COACHES[0];
  document.title = player.cn + ' · 动作档案 | 篮训BOT';
  document.documentElement.style.setProperty('--portrait','url("' + player.portrait + '")');
  document.getElementById('heroTitle').innerHTML = player.cn + '<span class="ghost">' + player.en + '</span>';
  document.getElementById('heroMeta').innerHTML = '<span>' + player.tag + '</span><span>' + player.role + '</span><span>' + player.era + '</span>';
  document.getElementById('heroLead').innerHTML = '<b>' + player.intro + '</b>';
  document.getElementById('story').textContent = player.story;
  document.getElementById('fileName').textContent = player.cn;
  document.getElementById('fileMeta').innerHTML = '<div><dt>英文名</dt><dd>' + player.en + '</dd></div><div><dt>定位</dt><dd>' + player.role + '</dd></div><div><dt>生涯 / 时期</dt><dd>' + player.era + '</dd></div><div><dt>训练标签</dt><dd>' + player.tag + '</dd></div>';
  document.getElementById('fileNo').textContent = player.no;
  document.getElementById('skillName').innerHTML = player.skill + '<span>' + player.code + '</span>';
  document.getElementById('skillText').textContent = player.skillText;
  document.getElementById('detailTitle').textContent = '练习 ' + player.skill;
  document.getElementById('cueList').innerHTML = player.cues.split('|').map(function(cue,index){return '<div class="cue"><b>0' + (index + 1) + '</b><span>' + cue + '</span></div>';}).join('');
  document.getElementById('monitor').textContent = player.monitor;
  document.getElementById('planTitle').textContent = '从「' + player.planLabel + '」开始，把 ' + player.skill + ' 练成你的动作。';
  document.getElementById('planLink').href = player.plan;
  var dot=document.querySelector('.cursor-dot'),ring=document.querySelector('.cursor-ring'),mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function loop(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);}());
  document.querySelectorAll('a,button').forEach(function(el){el.addEventListener('mouseenter',function(){ring.classList.add('hovering');});el.addEventListener('mouseleave',function(){ring.classList.remove('hovering');});});
  var nav=document.getElementById('nav');addEventListener('scroll',function(){nav.classList.toggle('scrolled',scrollY>40);},{passive:true});
  var io=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('in');io.unobserve(entry.target);}});},{threshold:.12});document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
}());
</script>
